<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A blocked inline script</title>
<style>
  body { font: 16px/1.5 sans-serif; color: #111; background: #fff; }
  a, button, input { color: #0043ce; }
  :focus-visible { outline: 2px solid #0043ce; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>A blocked inline script</h1>
  <p><a href="/elsewhere">Another page</a></p>
</main>
<script>document.title = "ran";</script>
</body>
</html>
