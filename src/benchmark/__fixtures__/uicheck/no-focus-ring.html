<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A button with no focus ring</title>
<style>
  body { font: 16px/1.5 sans-serif; color: #111; background: #fff; }
  a, button, input { color: #0043ce; }
  :focus-visible { outline: 2px solid #0043ce; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>A button with no focus ring</h1>
  <button type="button" style="outline: none">Go</button>
</main>
</body>
</html>
